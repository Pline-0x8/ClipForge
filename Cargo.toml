[package]
name = "clipforge"
version = "0.1.0-beta.1"
edition = "2024"
description = "ClipForge desktop clipboard manager with named registers and text history"
license = "MIT"

[dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
tauri = { version = "2", features = ["custom-protocol", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem"] }

[target.'cfg(not(windows))'.dependencies]
global-hotkey = "0.8"
enigo = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }

[profile.release]
lto = "thin"
strip = true
