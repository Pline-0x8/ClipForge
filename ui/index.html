<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ClipForge</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header><div><h1>ClipForge<span class="dot"></span></h1></div><button id="hide" class="icon" aria-label="Hide picker" title="Hide (Esc)">×</button></header>
<section class="intro"><div><h2 id="mode">Choose clipboard text</h2><p id="hint">Click a register to edit. Load text or drag history into a letter.</p></div><span class="shortcut">CTRL + ALT + SPACE</span></section>
<section id="current-clipboard" class="current-panel" draggable="true"><div class="section-head"><h3>Current clipboard</h3><span class="mini">CLICK TO EDIT</span></div><div id="current-preview" class="preview">No text on clipboard</div></section>
<main><section class="panel"><div class="section-head"><h3>Registers <span>26 slots</span></h3><button id="save-current" class="subtle">Save current…</button></div><div id="registers" class="list" role="list" aria-label="Letter registers"></div></section><section class="panel"><div class="section-head"><h3>History <span id="count">0 items</span></h3><span class="mini">NEWEST FIRST</span></div><div id="history" class="list" role="list" aria-label="Clipboard history"></div></section></main>
<footer><p id="status" role="status">Ready</p><div><button id="clear" class="danger">Clear all</button><button id="quit" class="subtle">Quit</button></div></footer>
<dialog id="save-dialog"><h2>Save current clipboard</h2><p>Choose a letter from a–z.</p><form id="save-form"><input id="save-letter" maxlength="1" pattern="[a-zA-Z]" required aria-label="Register letter" autocomplete="off"><button type="submit">Save</button><button id="cancel-save" type="button" class="subtle">Cancel</button></form><p id="save-error" class="error" role="alert"></p></dialog>

<script src="app.js" defer></script>
</body></html>
